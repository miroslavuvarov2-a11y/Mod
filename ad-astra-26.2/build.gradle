plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.39'
}
version = mod_version
group = mod_group_id
base.archivesName = mod_id
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
repositories {
    mavenCentral()
    maven { url = 'https://maven.teamresourceful.com/repository/maven-public/' }
}
runs {
    configureEach {
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
        systemProperty 'forge.logging.console.level', 'info'
    }
    client { systemProperty 'neoforged.enabledGameTestNamespaces', project.mod_id }
    server {
        systemProperty 'neoforged.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }
}
configurations { runtimeClasspath.extendsFrom localRuntime }
dependencies { implementation "net.neoforged:neoforge:${neo_version}" }
tasks.withType(ProcessResources).configureEach {
    var props = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version
    ]
    inputs.properties props
    filesMatching(['META-INF/neoforge.mods.toml']) { expand props }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
publishing {
    publications {
        register('mavenJava', MavenPublication) { from components.java }
    }
}
